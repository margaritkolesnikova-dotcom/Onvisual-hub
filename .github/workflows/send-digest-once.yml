name: Diagnose ONVISUAL endpoints

on:
  push:
    branches:
      - chatgpt-send-digest-20261009
    paths:
      - ".github/workflows/send-digest-once.yml"

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - name: Check ONVISUAL endpoints
        run: |
          echo "ROOT"
          curl -sS -o /tmp/root -w "%{http_code}\n" "https://onvisual-hub.vercel.app/"
          head -c 300 /tmp/root || true
          echo
          echo "DIGEST"
          curl -sS -o /tmp/digest -w "%{http_code}\n" "https://onvisual-hub.vercel.app/api/telegram-digest"
          cat /tmp/digest || true
          echo
          echo "TEST"
          curl -sS -o /tmp/test -w "%{http_code}\n" "https://onvisual-hub.vercel.app/api/telegram-test"
          cat /tmp/test || true
